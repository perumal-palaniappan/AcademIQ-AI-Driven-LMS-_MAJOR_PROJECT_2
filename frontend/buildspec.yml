version: 0.2
env:
  variables:
    AWS_DEFAULT_REGION: ap-south-1
    REPOSITORY_URI: 711699152383.dkr.ecr.ap-south-1.amazonaws.com/pipeline-fe-repo
    IMAGE_TAG: latest

phases:
  pre_build:
    commands:
    # define repository URI here when we use terraform(don't define under env)
      # - REPOSITORY_URI=$AWS_REPOSITORY_URI
      - |
        if [ -z "$REPOSITORY_URI" ]; then
          echo "ERROR: Set REPOSITORY_URI in the CodeBuild environment variables"
          exit 1
        fi
      - REGISTRY_URI=$(echo "$REPOSITORY_URI" | cut -d'/' -f1)
      - echo "Log in to Amazon ECR"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY_URI"
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}
      - IMAGE_TAG=$(echo "$IMAGE_TAG" | cut -c 1-40)

  build:
    commands:
      - echo Build started
      - docker build --platform linux/amd64 --pull -f frontend/Dockerfile -t "$REPOSITORY_URI:$IMAGE_TAG" -t "$REPOSITORY_URI:latest" ./frontend

  post_build:
    commands:
      - echo Pushing image...
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$REPOSITORY_URI:latest"
      - echo Build completed
      - printf '[{"name":"frontend","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json
      # This is for CD purpose
      - echo "Triggering ECS deployment"
      - aws ecs update-service --cluster pipeline-cluster --service pipeline-fe-service --force-new-deployment

artifacts:
  files:
    - imagedefinitions.json

