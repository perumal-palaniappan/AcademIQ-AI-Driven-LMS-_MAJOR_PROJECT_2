version: 0.2
env:
  variables:
    AWS_DEFAULT_REGION: ap-south-1
    REPOSITORY_URI: 696263047337.dkr.ecr.ap-south-1.amazonaws.com/fe-lms-repo
    IMAGE_TAG: latest

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws --version
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $REPOSITORY_URI

  build:
    commands:
      - echo Build started
      - docker build --platform linux/amd64 --pull -f frontend/Dockerfile -t "$REPOSITORY_URI:$IMAGE_TAG" -t "$REPOSITORY_URI:latest" ./frontend

  post_build:
    commands:
      - echo Pushing image...
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$REPOSITORY_URI:latest"
      - echo Build completed
      - echo "Triggering ECS deployment"
      - aws ecs update-service --cluster lms-cluster --service fe-task-service --force-new-deployment



