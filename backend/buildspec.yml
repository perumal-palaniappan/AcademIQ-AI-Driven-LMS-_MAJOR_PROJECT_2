version: 0.2

env:
  variables:
    REPOSITORY_URI: "696263047337.dkr.ecr.ap-south-1.amazonaws.com/backend"
    AWS_DEFAULT_REGION: "ap-south-1"

phases:
  install:
    commands:
      - echo "Preparing Docker build; dependencies are installed by backend/Dockerfile"

  pre_build:
    commands:
      - |
        if [ -z "$REPOSITORY_URI" ]; then
          echo "ERROR: Set REPOSITORY_URI in the CodeBuild environment variables"
          exit 1
        fi
      - REGISTRY_URI=$(echo "$REPOSITORY_URI" | cut -d'/' -f1)
      - echo "Log in to Amazon ECR"
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$REGISTRY_URI"
      - IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:-latest}
      - IMAGE_TAG=$(echo "$IMAGE_TAG" | cut -c 1-40)

  build:
    commands:
      - echo "Building backend Docker image"
      - docker build --platform linux/amd64 --pull -f backend/Dockerfile -t "$REPOSITORY_URI:$IMAGE_TAG" -t "$REPOSITORY_URI:latest" ./backend

  post_build:
    commands:
      - echo "Pushing backend Docker image to ECR"
      - docker push "$REPOSITORY_URI:$IMAGE_TAG"
      - docker push "$REPOSITORY_URI:latest"
      - printf '[{"name":"backend","imageUri":"%s"}]' $REPOSITORY_URI:$IMAGE_TAG > imagedefinitions.json
      - cat imagedefinitions.json
      # This is for CD purpose
      # - echo "Triggering ECS deployment"
      # - aws ecs update-service --cluster lms-cluster --service backend-task-service --force-new-deployment

artifacts:
  files:
    - imagedefinitions.json
      